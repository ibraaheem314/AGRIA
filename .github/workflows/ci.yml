name: CI

on:
  push:
  pull_request:

# Lecture seule : aucun job n'écrit dans le dépôt ni n'utilise de secret.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agria
          POSTGRES_DB: agria
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5444:5432"]
        options: >-
          --health-cmd "pg_isready -U agria" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-uniquement-cle-non-secrete-de-plus-de-32-caracteres
      DJANGO_DEBUG: "true"
      DB_NAME: agria
      DB_USER: agria
      DB_HOST: 127.0.0.1
      DB_PORT: "5444"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.8"
      - run: python -m pip install -r requirements-dev.txt
      # Motifs de clés dans les fichiers suivis (aucune valeur réelle n'est disponible en CI).
      - run: python ../scripts/verifier_secrets.py
      - run: python -m ruff check . ../scripts
      - run: python -m ruff format --check . ../scripts
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.8"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Ce job possède le build ; le contrôle backend ne peut pas le voir.
      - run: python ../scripts/verifier_secrets.py

  parcours:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agria
          POSTGRES_DB: agria
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5444:5432"]
        options: >-
          --health-cmd "pg_isready -U agria" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DJANGO_SECRET_KEY: ci-uniquement-cle-non-secrete-de-plus-de-32-caracteres
      DJANGO_DEBUG: "true"
      DB_NAME: agria
      DB_USER: agria
      DB_HOST: 127.0.0.1
      DB_PORT: "5444"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.8"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: sudo apt-get install -y postgresql-client
      - run: python -m venv backend/.venv && backend/.venv/bin/python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
