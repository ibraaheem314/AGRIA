name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agria
          POSTGRES_DB: agria
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5444:5432"]
        options: >-
          --health-cmd "pg_isready -U agria" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-uniquement-cle-non-secrete-de-plus-de-32-caracteres
      DJANGO_DEBUG: "true"
      DB_NAME: agria
      DB_USER: agria
      DB_HOST: 127.0.0.1
      DB_PORT: "5444"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check . ../scripts
      - run: python -m ruff format --check . ../scripts
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  parcours:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agria
          POSTGRES_DB: agria
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5444:5432"]
        options: >-
          --health-cmd "pg_isready -U agria" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DJANGO_SECRET_KEY: ci-uniquement-cle-non-secrete-de-plus-de-32-caracteres
      DJANGO_DEBUG: "true"
      DB_NAME: agria
      DB_USER: agria
      DB_HOST: 127.0.0.1
      DB_PORT: "5444"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y postgresql-client
      - run: python -m venv backend/.venv && backend/.venv/bin/python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
